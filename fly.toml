# civicguard-india-app is the Fly.io app name (public URL: https://civicguard-india-app.fly.dev)
app = "civicguard-india-app"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  UPLOAD_DIR = "/app/uploads"
  MAX_FILE_SIZE_MB = "50"
  ANTHROPIC_MODEL = "claude-sonnet-4-6"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
