<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicGuard Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <header class="border-b bg-white">
      <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
        <h1 class="text-xl font-semibold tracking-tight">CivicGuard</h1>
        <span class="rounded-full bg-amber-100 px-3 py-1 text-sm text-amber-800">Skeleton</span>
      </div>
    </header>
    <main class="mx-auto max-w-5xl px-6 py-12">
      <h2 class="text-2xl font-medium">Incoming reports</h2>
      <p class="mt-2 max-w-xl text-slate-600">
        Human review queue will appear here. Upload, triage, and case APIs are not wired yet.
      </p>
      <div class="mt-8 rounded-lg border border-dashed border-slate-300 bg-white p-10 text-center text-slate-500">
        No reports yet.
      </div>
    </main>
  </body>
</html>
